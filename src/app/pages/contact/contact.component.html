<div fxLayout="column" fxLayout.gt-sm="row" fxLayoutGap="20px" class="contact-container">
  <div fxFlex="100%" fxFlex.gt-sm="50%">
    <app-contact-form></app-contact-form>
  </div>
  <mat-divider [vertical]="true" fxHide.lt-md></mat-divider>
  <mat-divider fxHide.gt-sm></mat-divider>
  <div fxFlex="100%" fxFlex.gt-sm="50%">
    <h2>{{ T.contact_info_header | text }}</h2>
    <!--    <div class="contact-info-grid">-->
    <div>
      <app-contact-info
        [label]="getText(T.address_label)"
        [value]="getText(T.address_value)"
        [icon]="'location_on'"
        [canBeCopied]="false"
        [labelWidth]="labelWidth"
      ></app-contact-info>
      <app-contact-info
        [label]="getText(T.phone_label)"
        [value]="getText(T.phone_value)"
        [icon]="'phone'"
        [canBeCopied]="true"
        [successCopyMessage]="getText(T.value_copied)"
        [labelWidth]="labelWidth"
      ></app-contact-info>
      <app-contact-info
        [label]="getText(T.email_label)"
        [value]="getText(T.email_value)"
        [icon]="'mail'"
        [canBeCopied]="true"
        [successCopyMessage]="getText(T.value_copied)"
        [labelWidth]="labelWidth"
      ></app-contact-info>
      <div class="map-container">
        <iframe
          src="https://maps.google.com/maps?q=Komensk%C3%A9ho+19%2C+03601+Martin&output=embed"
          width="100%" height="250" style="border:0" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</div>
